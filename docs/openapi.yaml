  "/api/analytics/breakdown":
    get:
      tags: ["Analytics"]
      operationId: "getAnalyticsbreakdown"
      summary: "The same figures cut by client, board, technician or priority"
      description: "Takes `dimension` (client, board, technician or priority; anything else falls back to client so a stale bookmark still opens) plus the shared report filters, and returns the tickets per group. For the client dimension it also joins the client-value report and returns a 0-100 account-health score with the reasons behind it: how old the oldest open ticket is, how much of the load is high priority, how much of what was invoiced is still out, and whether anything has been collected. A score is returned as well as a band because with a uniformly aged backlog every client reads the same band and the column stops carrying information. health, score and reason are null for the dimensions that have no client economics behind them, rather than inventing a band. Requires report:view."
      security: [{ "bearerAuth": [] }]
      x-required-permissions: ["report:view"]
      x-source: "analytics.ts · analyticsRouter.get"
      responses:
