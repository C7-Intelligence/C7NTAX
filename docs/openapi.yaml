        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  "/api/analytics/funnel":
    get:
      tags: ["Analytics"]
      operationId: "getAnalyticsfunnel"
      summary: "Cash realisation: worked, billable, invoiced, collected"
      description: "The same delivered work at each step it can leak, assembled from three reports rather than recomputed: effort from time-tracking, value from technician-utilization, billing and collection from contract-profitability. Each step returns its value and a `leak` sentence naming what was lost between it and the previous step - hours recorded as non-billable, agreement hours that carry no rate and so can never become revenue, and the amount invoiced and not yet collected. The invoiced and collected steps are agreement-scoped, which `reading` states, because hours delivered against agreements are the part of the funnel that has a price attached. Requires report:view and honours the shared report filters."
      security: [{ "bearerAuth": [] }]
      x-required-permissions: ["report:view"]
      x-source: "analytics.ts · analyticsRouter.get"
      responses:
        "200": { description: "OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  "/api/analytics/overview":
    get:
      tags: ["Analytics"]
      operationId: "getAnalyticsoverview"
      summary: "Every measure for one period, with the period's own limitations"
      description: "Twenty-one measures computed from the same builders the standard reports use, in one round of queries rather than nine screens. Each measure returns its value, a sentence saying what the number means for this period, and a tone derived from its target; a measure with no target is neutral rather than good, because no target means no claim. `limitations` carries the data-quality sentences the builders themselves report - a period with no date range cannot produce a utilisation percentage, entries without a rate make recorded value a floor, and a period where no technician carries a cost rate makes every margin read high - so the screen can state why a figure should not be trusted rather than showing a percentage that is 100% because nothing was measured. A measure that cannot be computed is returned as null with the reason in its reading. Honours from, to, clientId and boardId through the shared report filters, and can only narrow the caller's own scope. Requires report:view."
      security: [{ "bearerAuth": [] }]
      x-required-permissions: ["report:view"]
      x-source: "analytics.ts · analyticsRouter.get"
      responses:
