  "/api/billing/invoices/{id}/pdf":
    get:
      tags: ["Billing"]
      operationId: "getBillinginvoicesbyIdpdf"
      summary: "An invoice, drawn as a printable page"
      description: "The invoice as a **standalone HTML document** — not JSON — ready to print or save as a PDF: a white A4 or Letter sheet with 18 mm margins, the instance's letterhead from `brandForDocument(\"invoice\")`, an unambiguous date format, the money block, a pay block and a footer with page *n* of *m*. Deliberately self-contained: the CSS is inlined because the page is fetched on its own, and a document is not a screen, so it never follows the user's theme. The amount due is the balance the **payments** make it, so a part-paid invoice states what is outstanding rather than the gross total; when the recorded status and the recorded payments disagree, the payments win and the page says so. `taxRate` is read with the repo's convention — above 1 it is a percentage, at or below 1 a fraction — so an invoice recording 8.5 prints `Sales tax · 8.5% · US · IL` and not `Tax (850.0%)`. An invoice with no `InvoiceLineItem` rows states the agreement its amount came from instead of printing an empty table over a live subtotal. Requires billing:view and the client scope the caller already carries; a company-scoped account gets 403 for another client's invoice."
      security: [{ "bearerAuth": [] }]
      x-required-permissions: ["billing:view"]
      x-source: "billing.ts · billingRouter.get"
      parameters:
        - name: "id"
          in: path
