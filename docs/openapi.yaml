        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  "/api/developer/purge":
    post:
      tags: ["Developer"]
      operationId: "postDeveloperpurge"
      summary: "Purge the sample data, exactly as db:sample-off does"
      description: "Body: `{ phrase, reason }`. **Refused with 400 unless the phrase matches `requiredPhrase` exactly and the reason is a sentence** — a `details` list names which field failed (`phrase`, `reason`), and the message says so too. Refused with **409** when the sample dataset is already disabled (the CLI returns quietly in that state; a route that did would answer 200 for an act that did not happen) and when a purge is already running.\n\nWhat it does is `pnpm db:sample-off`'s own code path, called rather than re-implemented: take a snapshot, delete `WIPE_MODELS` children-before-parents, then set `.sample-data-disabled`. While that marker is set the snapshot is **locked** — automatic snapshot capture and the automatic reseed after a change both stop — and `pnpm db:sample-on` is what clears it and reseeds. `KEEP_MODELS` and the unlisted models are untouched, so the instance stays usable but not empty of everything an operator might expect.\n\n**The receipt is the record, and it is written where the purge cannot reach it.** The purge deletes `auditLog`, so the audit row is written *after* the wipe and the durable copy is a `SystemConfig` row under the reserved `sample_data:` prefix, which the general configuration endpoint refuses to every caller including administrators. The response names it in `receiptPath` and `wrote`, and carries who, when, why, the phrase, the dry-run figure, the rows and tables removed, and the snapshot taken. A purge takes as long as the snapshot capture takes, so a client may give up before the answer arrives — the work continues and the receipt is still written. **Requires `developer:purge` *and* `developer:view`**, chained rather than listed together: `developer:view` alone cannot purge, and neither Super Admin nor Admin holds either permission."
      requestBody:
