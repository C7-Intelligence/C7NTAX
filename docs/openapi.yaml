  "/api/developer/deployment":
    get:
      tags: ["Developer"]
      operationId: "getDeveloperdeployment"
      summary: "Where the deployment stands against PLAN-030"
      description: "The Azure go-live plan with a surface: eight steps — target and naming, parameters and secrets, infrastructure, database, the readiness gate, network and ingress, sanitisation, and validate-and-hand-off — each with whether it is shared or Azure-specific, a state drawn from five values (`done`, `attention`, `blocked`, `decision`, `unverified`), what the step decides, the commands that run it, and a checklist whose every item names the evidence its state was decided from and what happens if it is skipped.\n\n**Derived where it can be, `unverified` where it cannot.** An item whose answer is in this repository is decided by reading it — the migrations that exist, whether a deployment switch is set, whether TLS verification is on, the database name, whether the API has a readiness endpoint and whether both promotion gates ask it, whether the parameter file still carries a placeholder. Everything else is `unverified` with the reason, and nothing in this package has met an Azure subscription (said in `plan.unverified` and in `unread`). The two open items — `webOrigin` still a placeholder, and the app connecting as the server administrator — come back as `blocked`/`attention` rather than green, and the last High item, the least-privilege database role, is a `decision` deferred by the operator rather than a forgotten finding. Also carries the four advisories, the four decisions the operator owns with their recommendation, the §8.11 go-live bar, and a hand-off summary. Requires `developer:view`."
      security: [{ "bearerAuth": [] }]
      x-required-permissions: ["developer:view"]
      x-source: "developer.ts · developerRouter.get"
      responses:
        "200": { description: "OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  "/api/developer/deployment/records":
    post:
      tags: ["Developer"]
      operationId: "postDeveloperdeploymentrecords"
      summary: "Record the answer to a decision or a check"
      description: "Body: `{ kind, id, note }` — `kind` is `decision` or `check`, `id` is one of the ids the report itself names under that kind (a decision such as `2.3`, or a checklist item such as `5.1`), and `note` is what was decided. **Refused with 400 naming the field that failed**: an unknown `kind`; an `id` this report does not name — or names under the *other* kind, so a checklist id submitted as a decision is refused rather than filed against the wrong list; and an empty `note`, because a record that names nothing is a record nobody can act on and it would sit in the payload looking like an answer. The refusals are a `details` list as well as a message.\n\n**Recording is not destructive**, so this needs `developer:view` like its siblings and deliberately not `developer:purge`: deciding what to do about the ingress is not the same act as emptying the database.\n\n**Where the answer is kept.** One record per subject, in `SystemConfig` under the reserved prefix `deployment:record:<kind>:<id>` — the same mechanism the purge receipt uses, and reserved in `routes/system.ts` beside `sample_data:`, so no HTTP caller can read or rewrite one (administrator included) and **a purge never touches it**. A decision taken before a purge is a decision that survives it, which matters because the purge is one of the things a decision may be about. Recording again **replaces** the answer rather than stacking a second one; the reply is `201` when the subject had no answer and one was created, `200` when an earlier answer was replaced.\n\nThe response is the **whole payload `GET /api/developer/deployment` would have returned** — including the updated records — plus `saved` naming the record just written, so a screen re-renders from one response instead of a write followed by a read. On the GET, every recorded answer appears three ways: in `records`, and attached to its own decision or checklist item as `record`. A record whose subject the report no longer names is still returned in `records` — a check that lost its id is exactly when somebody needs to read what was decided about it."
      requestBody:
        content:
          application/json:
            example: {"kind":"decision","id":"D1","note":"Front Door Premium alone, with a Private Link origin. Agreed with the operator."}
      security: [{ "bearerAuth": [] }]
      x-required-permissions: ["developer:view"]
      x-source: "developer.ts · developerRouter.post"
      responses:
        "200": { description: "OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  "/api/developer/environment":
    get:
      tags: ["Developer"]
      operationId: "getDeveloperenvironment"
      summary: "What this instance is configured to be"
      description: "Every environment name the application declares — the ones the configuration registry names as the variable a setting replaces, and the ones the API reads directly — reported as `set` or falling back to the declared default, with the value in force where it is safe to print it. **A secret is never returned**: a name that looks like a credential reports `set`, `secret: true`, `withheld: true`, `effective: null` and a `hint` (the last characters of a fingerprint, enough to confirm *which* value is in place), and the payload says so in `secretsWithheld`. Beside it, `badge` names the instance (NODE_ENV, whether that means production, the host and port, the app version, the git commit where it can be read), `flags` is the flag registry as read-only rows with what is saved and what the environment alone would give, and `settings` is the effective value of every declared setting grouped by configuration section. Requires `developer:view`, which only the `Developer Admin` role holds."
      security: [{ "bearerAuth": [] }]
