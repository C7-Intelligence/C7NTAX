  "/api/procurement/orders":
    get:
      tags: ["Procurement"]
      operationId: "getProcurementorders"
      summary: "List purchase orders"
      description: "Filtered by `status` and `vendorId`, newest first, with each order's vendor and lines included. Nothing here is client-scoped: a purchase order is ours, not a customer's."
