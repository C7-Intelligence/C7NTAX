      description: "Starts the OAuth device-code flow against Microsoft's public Graph command-line client, so nothing about the tenant is held here and the administrator signs in themselves. Returns the code to type and the URL to open; poll the session until it is authorised. The tenant may be a GUID or a primary domain, and a tenant that does not exist is refused by name."
