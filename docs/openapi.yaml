              example: {"authClientId":"14d82eec-204b-4c2f-b7e8-296a70dab67e","defaultDisplayName":"C7NTAX Email Connector","permissions":{"application":["Mail.ReadWrite"],"delegated":["Mail.ReadWrite","User.Read","offline_access"]},"redirectUri":"https://psa.example.com/api/email-connectors/oauth/callback","secretMonths":12,"script":{"file":"O365/New-C7NTAXMailboxApp.ps1","command":"pwsh -File O365/New-C7NTAXMailboxApp.ps1 -TenantId <tenant> -DelegateMailbox <mailbox>"}}
