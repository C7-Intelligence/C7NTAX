        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  "/api/analytics/catalogue":
    get:
      tags: ["Analytics"]
      operationId: "getAnalyticscatalogue"
      summary: "The measure catalogue: what each figure on the analytics screen means"
      description: "The definitions behind the Analytics workspace: every measure with its label, group (service, responsiveness, effort, money, experience, commercial), unit, the sentence describing what it means and what it does not, which direction is good news, its target where one exists, and the endpoint and field it is read from. Also returns the measure groups and the four breakdown dimensions. The definitions live here rather than being written on the screen so that a figure and its explanation cannot drift apart, and the `source` field is a claim that can be checked: every measure is computed by a builder that already serves a standard report. Requires report:view."
      security: [{ "bearerAuth": [] }]
      x-required-permissions: ["report:view"]
      x-source: "analytics.ts · analyticsRouter.get"
      responses:
