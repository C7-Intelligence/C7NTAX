        "429": { $ref: "#/components/responses/TooManyRequests" }
  "/api/api-keys":
    get:
      tags: ["API keys"]
      operationId: "getApiKeys"
      summary: "The key inventory"
      description: "Names, prefixes, scopes, owner, last use and state — never the secret and never its hash. `?includeRevoked=true` keeps the history."
      security: [{ "bearerAuth": [] }]
