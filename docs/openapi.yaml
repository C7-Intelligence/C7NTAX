      operationId: "patchUsersbyIdmfa"
      summary: "Say whether one account has to have a second factor"
      description: "The per-account half of the MFA policy, and the answer to \"everyone except this one\". `state` is `default` (follow the instance setting), `disabled` (exempt from a requirement — an account that has already enrolled keeps being asked for its factor, because this exempts it from being *required* to have one, not from having one) or `enforced` (required whichever way the instance setting is set). The words are Entra's on purpose: an administrator who has used Entra already knows them. **Requiring is not enrolling** — nothing here touches what the account has set up, and an account that is required but has not enrolled is given the configured grace period rather than stopped on the spot, so the answer includes the resolved `policy` for the target. Moving an account to `disabled` clears any deadline it was given, since the countdown no longer applies. Requires the `mfa:enforce` permission, which is what that permission was declared for."
