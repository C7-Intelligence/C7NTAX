  "/api/developer/health":
    get:
      tags: ["Developer"]
      operationId: "getDeveloperhealth"
      summary: "The repository's own guards, as they answer on this working copy"
      description: "Runs the repository's check scripts — `check-route-guards`, `check-api-docs`, `check-config-reads`, `check-console-catalog`, `plugin-metadata check`, `audit-baseline`, `check-encoding`, `check-help-links`, `lint-design-tokens` — as child processes from the repository root, and reports each with its command, its own output (`detail`) and how long it took. Status is one of **three** words: `pass`, `fail`, or `skip` — and a check that could not run (its script is not on this working copy, the tool it needs is not installed, or it ran out of time) is `skip` with the reason, *never* a pass. A failing check never fails the request: the failure list is the answer, and an HTTP 500 instead of \"plugin metadata: fail\" would hide the thing the panel exists to show. On this tree `guard:plugin` fails and `guard:deps` needs `pnpm audit`, so it may not run at all. Requires `developer:view`."
      security: [{ "bearerAuth": [] }]
