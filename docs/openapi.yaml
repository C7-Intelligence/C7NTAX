    post:
      tags: ["Oauth App"]
      operationId: "postOauthAppbySessionIdpoll"
      summary: "Has the administrator approved the sign-in yet?"
      description: "Asks Microsoft. Answers `pending` while the code is unapproved (and lengthens the interval if Microsoft says `slow_down`), `authorized` once a token has been granted — with the account and tenant id read from that token's claims — or `declined`/`expired` with the reason. Deploying before this says `authorized` is refused with 409."
