    patch:
      tags: ["Tickets"]
      operationId: "patchTicketsbyId"
      summary: "Update a ticket, including closing it"
      description: "Status, priority, assignment, board and the rest. A status change emails the ticket's contact — that is what the notifications are — so two fields exist to control it. `closeNotes` is the reason the ticket is being closed: it is written to the (customer-visible) thread and it is what the closing email says. `notifyCustomer: false` does the same work in silence, for a ticket whose contact has gone or one closed by mistake.\n\n**Omitting `notifyCustomer` is not the same as sending it**, on a status change that settles the ticket: an absent value means the caller has no opinion and the ticket's board decides, via `notifyCustomerOnClose`. That is how a board whose tickets arrive from monitoring systems at no-reply addresses stays quiet. An explicit `true` or `false` always wins, in both directions.\n\nClosing settles the ticket (`closed`, `resolved`, `cancelled`) and emails the client a message that invites a reply. A reply from one of the client's own contacts reopens the ticket as `customer_reopened` and puts it back in the queue — the reply itself is recorded on the ticket before the status changes."
      requestBody:
        content:
          application/json:
            example: {"status":"closed","closeNotes":"Replaced the failing switch and confirmed the link is stable.","notifyCustomer":true}
