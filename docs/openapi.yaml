      description: "The permissions a deployment will request (`Mail.ReadWrite` as an application role, `Mail.ReadWrite`/`User.Read`/`offline_access` delegated), the redirect URI this instance must be registered with for the delegated flow, the default registration name, and the by-hand command that does the same thing from a terminal. `integration:manage`."
