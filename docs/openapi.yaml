      description: "Newest first, filterable by `result` (`success`, `failure`, `locked`, `mfa_failed`, `code_failed`, `signed_out`), `userId`, a `from`/`to` window and a `search` across the address, device, IP address and reason. The `summary` beside the rows counts the whole **filtered** set, not the page, so \"how many of these were lockouts\" is answerable per window. Each row names the `method` — password, authenticator app, emailed code, passkey, single sign-on or portal code — which is what separates \"signed in\" from \"signed in with a second factor\". A row is written for every way in and for signing out, successes included, and `userId` is null when the address typed was not an account. Events about an account on the **Developer Admin** role are withheld from a caller who is not a Super Admin — by account *and* by address, because a row records what was typed and can be written with no `userId` at all — and the `summary` is counted over the same filtered set. A row whose address is not an account at all still reads, because what it holds is what somebody typed. Requires `security:manage`."
