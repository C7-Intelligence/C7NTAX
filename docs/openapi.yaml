  "/api/brand":
    get:
      tags: ["Brand"]
      operationId: "getBrand"
      summary: "The instance's identity, and what each kind of document wears"
      description: "One read for the whole Branding section, because its four subjects are four views of one record. Returns the identity ? product and company name, tagline, the letterhead logo and its dark variant, the square icon, the wordmark, the contact line and postal address, the website, the two colours, the document footer and legal text, and the email sender ? plus `documents`, one row per document family with its presentation already resolved (family default, then what is stored) and a `changed` flag; the fixed document `palette`; and `contrast`, the ratio of each settable colour against paper with the `minimum` a printed mark needs. `documentPresentation` is the raw stored map, and `effective` is what every send actually uses with defaults applied. Requires branding:view."
      security: [{ "bearerAuth": [] }]
      x-required-permissions: ["branding:view"]
      x-source: "brand.ts · brandRouter.get"
      responses:
        "200": { description: "OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    put:
      tags: ["Brand"]
      operationId: "putBrand"
      summary: "Save the instance's identity"
      description: "Partial semantics that matter: a field **absent** from the body is left alone, a field present and blank clears it, so a screen that owns only part of the record cannot empty somebody else's field. `documentPresentation` is a map keyed by document family. Colours are refused unless they are a three- or six-digit hex value, and the sender and reply-to addresses are refused unless they parse as addresses. Writes an audit row. Requires branding:manage."
      security: [{ "bearerAuth": [] }]
      x-required-permissions: ["branding:manage"]
      x-source: "brand.ts · brandRouter.put"
      responses:
        "200": { description: "OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  "/api/brand/asset/{id}":
    get:
      tags: ["Brand"]
      operationId: "getBrandassetbyId"
      summary: "An uploaded logo or icon"
      description: "The stored bytes of one upload, with its content type, cacheable immutably ? a new upload is a new id, so a cached mark can never be stale. **Deliberately public**, and the only route in this API that is: a logo is an image inside an email and on a printed page, so it must be fetchable by a mail client that holds no session here, and serving it from the database by an opaque id means there is no filename to trust and no directory to traverse. It also sends `Cross-Origin-Resource-Policy: cross-origin`, which is required rather than generous ? the document it appears on is fetched from this API and rendered by the web app, so the image is cross-origin by construction."
      security: [{ "bearerAuth": [] }]
      x-required-permissions: []
      x-permission-note: "No permission is required beyond being signed in."
      x-source: "brand.ts · brandRouter.get"
      parameters:
        - name: "id"
          in: path
          required: true
          schema: { type: "string" }
      responses:
        "200": { description: "OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  "/api/brand/assets":
    post:
      tags: ["Brand"]
      operationId: "postBrandassets"
      summary: "Upload a logo or an icon"
      description: "Takes `{ kind, dataUrl }` where `kind` is `logo`, `logoDark` or `icon` and `dataUrl` is what a browser's FileReader produces, and answers `{ id, url, contentType, byteSize }` with 201. PNG, JPEG or WebP only ? **SVG is refused**, because an uploaded SVG is a script with an image's extension ? and 2 MB. The bytes are checked against their own magic number rather than trusted from the request, so a renamed file cannot be stored as an image and served back. The returned `url` is `/api/brand/asset/<id>`: put it in `logoUrl`, `logoDarkUrl` or `iconUrl` and save. Requires branding:manage."
      security: [{ "bearerAuth": [] }]
      x-required-permissions: ["branding:manage"]
      x-source: "brand.ts · brandRouter.post"
