        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      tags: ["Procurement"]
      operationId: "postProcurementorders"
      summary: "Raise a purchase order"
      description: "`vendorId` is required and the number is generated (`PO-?`). Totals are computed from the lines, so `subtotal` sent by a caller is ignored."
      requestBody:
        content:
          application/json:
            example: {"vendorId":"?","items":[{"description":"1TB NVMe SSD","quantity":12,"unitPrice":200,"productId":"?"}]}
      security: [{ "bearerAuth": [] }]
      x-required-permissions: ["billing:manage"]
      x-source: "procurement.ts · procurementRouter.post"
      responses:
        "200": { description: "OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  "/api/procurement/orders/{id}":
    get:
      tags: ["Procurement"]
      operationId: "getProcurementordersbyId"
      summary: "One purchase order, in full"
      description: "The record rather than the row: the lines as ordered (with the catalog SKU where a line came from the catalog), the vendor's own details, who raised and who approved it, and the four dates that say whether it is late — created, ordered, expected, received."
      security: [{ "bearerAuth": [] }]
      x-required-permissions: ["billing:view"]
      x-source: "procurement.ts · procurementRouter.get"
      parameters:
        - name: "id"
          in: path
          required: true
          schema: { type: "string" }
      responses:
        "200": { description: "OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    patch:
      tags: ["Procurement"]
      operationId: "patchProcurementordersbyId"
      summary: "Move a purchase order along, or re-price it before it arrives"
      description: "`status` is one of `draft`, `ordered`, `shipped`, `received`; moving to `ordered` stamps `orderedAt` and moving to `received` stamps `receivedAt` unless a date is sent, so a late delivery can be recorded as the day it actually arrived. `expectedAt` and `notes` are editable at any point.\n\n**Receiving an order writes the asset inventory**: one asset per unit, named from the line, tagged `{poNumber}-{line}-{unit}`, priced at the line's cost and carrying the order number, unassigned until somebody puts it at a client. The reply's `assets.created` says how many were written; one line is capped at 25 records and the remainder is added to the order's notes rather than dropped; re-receiving the same order writes nothing twice.\n\n`lineItems` replaces the lines and recomputes `subtotal` and `total` from them — refused once the order is `received`, because a receipt is a record of what arrived and a line list that can change afterwards is not one. A status moved back from `received` clears `receivedAt`."
      security: [{ "bearerAuth": [] }]
      x-required-permissions: ["billing:manage"]
      x-source: "procurement.ts · procurementRouter.patch"
      parameters:
        - name: "id"
          in: path
          required: true
          schema: { type: "string" }
      responses:
        "200": { description: "OK" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
