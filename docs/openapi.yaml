  "/api/oauth-app/{sessionId}/deploy":
    post:
      tags: ["Oauth App"]
      operationId: "postOauthAppbySessionIddeploy"
      summary: "Create or reuse the registration, grant consent, mint the secret"
      description: "The same sequence as `O365/New-C7NTAXMailboxApp.ps1`, over Graph: find or create the application by display name (an existing one is *reused*, not duplicated), record `requiredResourceAccess` with the application role id of `Mail.ReadWrite` (and the delegated scope ids plus the redirect URI when the delegated flow is wanted), create the service principal consent is granted *to*, grant admin consent with all three ids, and create a client secret for 12 months unless the flow is delegated (which uses PKCE and must not have one). Also returns the Exchange Online commands that scope an app-only registration to one mailbox — Graph has no route to those. The secret is returned once and never stored by this API; the audit row keeps the expiry instead."
      security: [{ "bearerAuth": [] }]
      x-required-permissions: ["integration:manage"]
      x-source: "oauthApp.ts · oauthAppRouter.post"
      parameters:
        - name: "sessionId"
          in: path
          required: true
          schema: { type: "string" }
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              example: {"tenantId":"contoso.onmicrosoft.com","clientId":"1a2b3c4d-…","clientSecret":"…","secretExpiry":"2027-10-08T00:00:00Z","displayName":"C7NTAX Email Connector","mode":"AppOnly","reusedRegistration":false,"permissions":{"application":["Mail.ReadWrite"],"delegated":[]},"scopingCommands":"New-ServicePrincipal -AppId 1a2b3c4d-… -ObjectId sp-… -DisplayName \"C7NTAX Email Connector\"","warnings":["Confirm the Exchange Online scoping commands were run: until they are, an app-only registration can read every mailbox in the tenant."]}
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
